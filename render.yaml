# Render Blueprint: Dashboard -> New -> Blueprint -> odaberi ovaj repozitorij
# Kreira oba servisa odjednom (backend Web Service + frontend Static Site).
services:
  # Express REST API
  - type: web
    name: rs-vjezba1-backend
    runtime: node
    plan: free
    rootDir: vjezbe/vjezbe1/backend_app
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Nakon prvog deploya mozes staviti URL frontenda umjesto '*'
      - key: CORS_ORIGIN
        value: "*"

  # Vue.js aplikacija (staticni sadrzaj iz dist/)
  - type: web
    name: rs-vjezba1-frontend
    runtime: static
    rootDir: vjezbe/vjezbe1/frontend_app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render ce traziti vrijednost pri kreiranju Blueprinta,
      # npr. https://rs-vjezba1-backend.onrender.com
      - key: VITE_API_URL
        sync: false
